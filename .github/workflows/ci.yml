name: dexhand-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tests.py
      - name: All experiments and the requirement table (fails if any requirement fails)
        run: python run_all.py | tee results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results.txt
            results.png
            hands.png
